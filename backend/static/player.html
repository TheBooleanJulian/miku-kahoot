<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MIKU-19 — Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050508; --panel: #0A0E14; --teal: #00D4C8; --gold: #F5C842;
    --text: #E8ECF0; --dim: #E8ECF0; --danger: #FF5C7A; --magenta: #FF4DD0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--void); color: var(--text); font-family: 'Space Grotesk', sans-serif; overscroll-behavior: none; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #app { min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }

  .screen { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; gap: 1.2rem; text-align: center; }
  h1 { font-size: 1.6rem; }
  .nav-back { position: absolute; top: 1rem; left: 1rem; color: var(--dim); text-decoration: none; font-size: 0.9rem; background: var(--panel); border: 1px solid #1A2029; padding: 0.4rem 0.9rem; border-radius: 999px; transition: 0.15s; cursor: pointer; font-family: inherit; }
  .nav-back:hover { color: var(--teal); border-color: var(--teal); }
  input {
    background: var(--panel); border: 1px solid #1A2029; color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; text-align: center;
    padding: 0.9rem; border-radius: 10px; width: 100%; max-width: 300px; letter-spacing: 0.15em;
  }
  input:focus { outline: none; border-color: var(--teal); }
  button.primary {
    background: var(--teal); color: #00201D; border: none; padding: 1rem 2rem;
    border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 1.1rem;
    cursor: pointer; width: 100%; max-width: 300px;
  }
  .err { color: var(--danger); font-size: 0.95rem; min-height: 1.2rem; }
  .dim { color: var(--dim); }
  .site-footer { color: var(--dim); font-size: 0.75rem; text-align: center; padding: 0.6rem 1rem; }

  .wait-pulse { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--teal); animation: pulse2 1.4s ease-in-out infinite; }
  @keyframes pulse2 { 0%,100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

  .name-tag { position: fixed; top: 0.8rem; left: 0.8rem; color: var(--dim); font-size: 0.8rem; }
  .score-tag { position: fixed; top: 0.8rem; right: 0.8rem; color: var(--gold); font-family: 'JetBrains Mono', monospace; font-weight: 700; }

  .qhead { padding: 1rem; text-align: center; }
  .qhead .meta { color: var(--dim); font-size: 0.85rem; }
  .qhead .qt { font-size: 1.2rem; font-weight: 700; margin-top: 0.3rem; }
  .timer-wrap { height: 8px; background: var(--panel); margin: 0 1rem; border-radius: 999px; overflow: hidden; }
  .timer-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold)); width: 100%; transition: width 0.1s linear; }

  .answer-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; padding: 1rem; }
  .ans-btn {
    border: none; border-radius: 14px; font-family: inherit; font-weight: 700; font-size: 1.1rem;
    color: #fff; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    cursor: pointer; transition: transform 0.1s; padding: 1rem;
  }
  .ans-btn:active { transform: scale(0.95); }
  .ans-btn.o0 { background: #C0392B; } .ans-btn.o1 { background: #2980B9; }
  .ans-btn.o2 { background: #F39C12; } .ans-btn.o3 { background: #27AE60; }
  .ans-btn:disabled { opacity: 0.4; }
  .ans-btn.chosen { outline: 4px solid #fff; }

  .media-wrap { display: flex; align-items: center; justify-content: center; max-height: 34vh; padding: 0.5rem 1rem 0; }
  .media-wrap img { max-height: 30vh; max-width: 100%; border-radius: 12px; border: 2px solid #1A2029; object-fit: contain; }
  .media-wrap audio { width: 100%; max-width: 320px; }

  .result-icon { font-size: 4rem; }
  .result-correct { color: var(--teal); }
  .result-wrong { color: var(--danger); }
  .points { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: var(--gold); }
  .streak { color: var(--dim); font-size: 0.95rem; }

  .lb-row { display: flex; align-items: center; gap: 1rem; width: 100%; max-width: 340px; background: var(--panel); border-radius: 10px; padding: 0.7rem 1rem; }
  .lb-rank { font-family: 'JetBrains Mono', monospace; color: var(--dim); width: 1.8rem; }
  .lb-name { flex: 1; font-weight: 700; text-align: left; }
  .lb-score { font-family: 'JetBrains Mono', monospace; color: var(--teal); }
  .lb-row.me { border: 1px solid var(--gold); }

  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 0.8rem; width: 100%; max-width: 420px; margin-top: 0.5rem; }
  .pod-col { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; flex: 1; }
  .pod-name { font-weight: 700; font-size: 0.9rem; max-width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod-score { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
  .pod-block { width: 100%; border-radius: 10px 10px 0 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #050508; }
  .pod-1 .pod-block { height: 120px; background: var(--gold); }
  .pod-2 .pod-block { height: 90px; background: #C7D0D9; }
  .pod-3 .pod-block { height: 70px; background: #C88A4B; }
  .pod-emoji { font-size: 1.5rem; line-height: 1; }
  .lb-emoji { font-size: 1.1rem; }

  /* ---------- Emoji picker ---------- */
  .emoji-label { color: var(--dim); font-size: 0.9rem; }
  .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.4rem; width: 100%; max-width: 300px; }
  .emoji-btn { background: var(--panel); border: 1px solid #1A2029; border-radius: 10px; font-size: 1.4rem; padding: 0.45rem 0; cursor: pointer; transition: 0.12s; }
  .emoji-btn:hover { border-color: var(--teal); transform: translateY(-2px); }
  .emoji-btn.sel { border-color: var(--gold); background: rgba(245,200,66,0.12); }

  /* ---------- Timer seconds ---------- */
  .timer-row { display: flex; align-items: center; gap: 0.6rem; padding: 0 1rem; }
  .timer-row .timer-wrap { flex: 1; height: 8px; background: var(--panel); border-radius: 999px; overflow: hidden; }
  .timer-sec { width: 1.6rem; text-align: center; color: var(--gold); font-weight: 700; }

  /* ---------- Particles ---------- */
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .part-dot { position: absolute; bottom: -14px; border-radius: 50%; background: radial-gradient(circle, rgba(0,212,200,0.55), rgba(0,212,200,0)); animation: floatUp linear infinite; }
  @keyframes floatUp { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 0.6; } 100% { transform: translateY(-105vh); opacity: 0; } }

  /* ---------- Shards ---------- */
  .shard { position: absolute; clip-path: polygon(50% 0, 100% 100%, 9% 100%); opacity: 0; pointer-events: none; animation: shardFloat linear infinite; }
  .shard.cyan { background: linear-gradient(160deg, var(--teal), rgba(0,212,200,0)); filter: drop-shadow(0 0 5px rgba(0,212,200,0.8)); }
  .shard.magenta { background: linear-gradient(160deg, var(--magenta), rgba(255,77,208,0)); filter: drop-shadow(0 0 5px rgba(255,77,208,0.8)); }
  @keyframes shardFloat { 0% { transform: translateY(0) rotate(var(--r, 0deg)); opacity: 0; } 12% { opacity: 0.55; } 88% { opacity: 0.55; } 100% { transform: translateY(-105vh) rotate(320deg) scale(1.15); opacity: 0; } }

  /* ---------- Podium reveal ---------- */
  .pod-col { opacity: 0; }
  .pod-3 { animation: podIn 0.75s cubic-bezier(.16,1,.3,1) 0.0s forwards; }
  .pod-2 { animation: podIn 0.75s cubic-bezier(.16,1,.3,1) 0.45s forwards; }
  .pod-1 { animation: podIn 0.75s cubic-bezier(.16,1,.3,1) 0.9s forwards; }
  @keyframes podIn { 0% { opacity: 0; transform: translateY(90px) scale(0.7); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<div class="particles" id="bgParticles"></div>
<div id="app"></div>
<canvas id="confetti-canvas"></canvas>
<script>
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
let ws = null;
let myName = '', myId = '', myScore = 0;
let myEmojiIdx = 0;
let leaving = false;
let hasAnswered = false;
let multi = false;
let selected = [];
let finished = false;
let timer = null, timeLeft = 0, timeLimit = 0;

function esc(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function setEmoji(i) { myEmojiIdx = i; document.querySelectorAll('.emoji-btn').forEach((b, bi) => b.classList.toggle('sel', bi === i)); }

const EMOJIS = ['😀','😎','🤖','🐱','🐶','🦊','🐼','🐸','🦄','🐉','👾','🌈','⚡','🍕','🍩','🌙'];

function render(html) { app.innerHTML = html; }

function renderJoin(err, kept) {
  const pinPrefill = params.get('pin') || '';
  const emojiGrid = EMOJIS.map((e, i) => `<button class="emoji-btn ${i === myEmojiIdx ? 'sel' : ''}" onclick="setEmoji(${i})">${e}</button>`).join('');
  render(`
    <div class="screen">
      <a class="nav-back" href="/">‹ Home</a>
      <h1>MIKU-19 Quiz</h1>
      <div class="dim">Enter the game PIN from the screen</div>
      <input id="pinInput" class="mono" placeholder="PIN" maxlength="6" inputmode="numeric" value="${esc(kept?.pin ?? pinPrefill)}">
      <input id="nameInput" placeholder="Your name" maxlength="20" value="${esc(kept?.name ?? '')}">
      <div class="emoji-label">Pick your emoji</div>
      <div class="emoji-grid">${emojiGrid}</div>
      <button class="primary" onclick="doJoin()">Join</button>
      <div class="err">${err || ''}</div>
    </div>
    <div class="site-footer mono">Built by TheBooleanJulian</div>
  `);
}

function doJoin() {
  const pin = document.getElementById('pinInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  if (!pin || !name) { renderJoin('Enter a PIN and a name', { pin, name }); return; }
  myName = name;
  const emoji = EMOJIS[myEmojiIdx] || '🙂';

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/player/${pin}`);
  ws.onopen = () => ws.send(JSON.stringify({ name, emoji }));
  ws.onmessage = (ev) => handleMessage(JSON.parse(ev.data));
  ws.onerror = () => renderJoin('Could not connect. Check the PIN.', { pin, name });
  ws.onclose = () => { if (!finished && !leaving) renderJoin('Disconnected.', { pin, name }); };
}

function handleMessage(msg) {
  if (msg.type === 'error') { renderJoin(msg.message); }
  else if (msg.type === 'joined') { myId = msg.player_id; renderWaiting(); }
  else if (msg.type === 'round_intro') { renderRoundIntro(msg); }
  else if (msg.type === 'question') { renderQuestion(msg); }
  else if (msg.type === 'answer_received') { markAnswered(msg.option); }
  else if (msg.type === 'your_result') { renderResult(msg); }
  else if (msg.type === 'leaderboard') { renderLeaderboard(msg); }
  else if (msg.type === 'final') { finished = true; renderPodium(msg.board || []); }
  else if (msg.type === 'kicked' || msg.type === 'host_left') { renderJoin('Removed from game.'); }
}

function renderWaiting(extra) {
  render(`
    <div id="waitScreen" class="screen">
      <button class="nav-back" onclick="backToJoin()">‹ Back</button>
      <div class="wait-pulse"></div>
      <h1>You're in, ${escapeHtml(myName)}!</h1>
      <div class="dim">${extra || 'Waiting for the host to start…'}</div>
    </div>
  `);
}

function backToJoin() {
  leaving = true;
  try { if (ws) ws.close(); } catch (e) {}
  myId = ''; myName = '';
  renderJoin();
}

function renderRoundIntro(msg) {
  renderWaiting(`Round ${msg.round_index + 1}: ${msg.round_title} — get ready`);
}

const SHAPES = ['▲', '◆', '●', '■'];

function renderQuestion(msg) {
  hasAnswered = false;
  multi = !!msg.multi;
  if (multi) selected = [];
  timeLimit = msg.time_limit;
  timeLeft = msg.time_limit;
  clearInterval(timer);

  const btns = msg.options.map((o, i) => `<button class="ans-btn o${i}" onclick="${multi ? `toggleAnswer(${i})` : `sendAnswer(${i})`}">${SHAPES[i]} ${escapeHtml(o)}</button>`).join('');
  const multiHint = multi ? `<div class="dim">Select all that apply</div>` : '';

  let mediaHtml = '';
  if (msg.round_type === 'image' && msg.media) {
    mediaHtml = `<div class="media-wrap"><img src="${msg.media}" alt=""></div>`;
  } else if (msg.round_type === 'audio' && msg.media) {
    mediaHtml = `<div class="media-wrap"><audio id="clip" src="${msg.media}" controls autoplay></audio></div>`;
  }

  render(`
    <div class="name-tag">${escapeHtml(myName)}</div>
    <div class="score-tag mono">${myScore}</div>
    <div class="qhead">
      <div class="meta">${escapeHtml(msg.round_title)} · Q${msg.question_index + 1}/${msg.question_count}</div>
      ${multiHint}
    </div>
    <div class="timer-row"><div class="timer-wrap"><div class="timer-fill" id="timerFill"></div></div><div class="timer-sec mono" id="timerSec"></div></div>
    ${mediaHtml}
    <div class="answer-grid" id="answerGrid">${btns}</div>
    ${multi ? `<div class="screen" style="padding:0 0 1.5rem"><button class="primary" onclick="submitSelection()">Submit</button></div>` : ''}
  `);

  const fill = document.getElementById('timerFill');
  const sec = document.getElementById('timerSec');
  timer = setInterval(() => {
    timeLeft -= 0.1;
    const pct = Math.max(0, (timeLeft / timeLimit) * 100);
    if (fill) fill.style.width = pct + '%';
    if (sec) sec.textContent = Math.ceil(Math.max(0, timeLeft));
    if (timeLeft <= 0) { clearInterval(timer); disableButtons(); }
  }, 100);
}

function toggleAnswer(i) {
  if (hasAnswered) return;
  const idx = selected.indexOf(i);
  if (idx >= 0) selected.splice(idx, 1); else selected.push(i);
  const btns = document.querySelectorAll('.ans-btn');
  btns[i] && btns[i].classList.toggle('chosen');
}

function submitSelection() {
  if (hasAnswered) return;
  if (!selected.length) return;
  hasAnswered = true;
  disableButtons();
  ws.send(JSON.stringify({ action: 'answer', option: selected }));
}

function sendAnswer(i) {
  if (hasAnswered) return;
  hasAnswered = true;
  disableButtons();
  ws.send(JSON.stringify({ action: 'answer', option: i }));
}

function markAnswered(i) {
  disableButtons();
  const opts = Array.isArray(i) ? i : [i];
  const btns = document.querySelectorAll('.ans-btn');
  opts.forEach(o => btns[o] && btns[o].classList.add('chosen'));
}

function disableButtons() {
  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
}

function renderResult(msg) {
  myScore = msg.score;
  const cls = msg.correct ? 'result-correct' : 'result-wrong';
  const icon = msg.correct ? '✓' : '✕';
  const answers = [].concat(msg.correct_option);
  const answerText = answers.map(c => `${SHAPES[c]} ${escapeHtml((msg.options||[])[c] || '')}`).join(' · ');
  const pts = msg.points_added ? `<div class="points">+${msg.points_added}</div>` : '';
  const streak = msg.streak >= 3 ? `<div class="streak">🔥 ${msg.streak} in a row</div>` : '';
  const explain = msg.explanation ? `<div class="streak" style="max-width:340px;line-height:1.5">${escapeHtml(msg.explanation)}</div>` : '';
  render(`
    <div class="score-tag mono">${myScore}</div>
    <div class="screen">
      <div class="result-icon ${cls}">${icon}</div>
      <h1>${msg.correct ? 'Correct!' : 'Not quite'}</h1>
      ${msg.correct ? pts : `<div class="dim">${answers.length > 1 ? 'Correct answers' : 'Correct answer'}: ${answerText}</div>`}
      ${streak}
      ${explain}
      <div class="dim">Waiting for the host…</div>
    </div>
  `);
}

function renderLeaderboard(msg, isFinal) {
  const rows = msg.board.map((p, i) => `
    <div class="lb-row ${p.name === myName ? 'me' : ''}"><div class="lb-rank mono">#${i+1}</div><div class="lb-emoji">${esc(p.emoji || '🙂')}</div><div class="lb-name">${escapeHtml(p.name)}</div><div class="lb-score mono">${p.score}</div></div>
  `).join('');
  render(`
    <div class="screen">
      <h1>${isFinal ? '🎉 Final Results' : 'Leaderboard'}</h1>
      ${rows || '<div class="dim">No scores yet</div>'}
      ${isFinal ? '<div class="dim">Thanks for playing!</div>' : '<div class="dim">Waiting for next question…</div>'}
    </div>
  `);
}

function renderPodium(board) {
  const cols = [];
  if (board[1]) cols.push(podCol(board[1], 2));
  if (board[0]) cols.push(podCol(board[0], 1));
  if (board[2]) cols.push(podCol(board[2], 3));
  const podiumHtml = cols.length ? `<div class="podium">${cols.join('')}</div>` : '<div class="dim">No players joined</div>';
  render(`
    <div class="screen">
      <h1>🏆 Final Results 🏆</h1>
      ${podiumHtml}
      <div class="dim">Thanks for playing!</div>
    </div>
    <div class="site-footer mono">Built by TheBooleanJulian</div>
  `);
  setTimeout(startConfetti, 700);
}

function podCol(p, place) {
  return `<div class="pod-col pod-${place}">
    <div class="pod-emoji">${esc(p.emoji || '🙂')}</div>
    <div class="pod-name">${escapeHtml(p.name)}</div>
    <div class="pod-score">${p.score}</div>
    <div class="pod-block">${place}</div>
  </div>`;
}

function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#00D4C8','#F5C842','#FF5C7A','#E8ECF0','#7C4DFF','#3DDC84','#FF9E3D'];
  const pieces = Array.from({length: 160}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*-canvas.height,
    w: 6+Math.random()*7, h: 9+Math.random()*9, vx: (Math.random()-0.5)*1.6, vy: 1.6+Math.random()*2.6,
    rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.12,
    color: colors[Math.floor(Math.random()*colors.length)],
  }));
  const end = performance.now() + 10000;
  function frame(now) {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (const p of pieces) {
      p.y += p.vy; p.x += p.vx; p.rot += p.vr;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random()*canvas.width; p.vy = 1.6+Math.random()*2.6; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.globalAlpha = 0.9;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    }
    if (now < end) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(frame);
}

function initParticles() {
  const hostEl = document.getElementById('bgParticles');
  if (!hostEl) return;
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('div');
    d.className = 'part-dot';
    const size = 3 + Math.random() * 7;
    d.style.width = d.style.height = size + 'px';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.animationDuration = (12 + Math.random() * 14) + 's';
    d.style.animationDelay = (-Math.random() * 20) + 's';
    hostEl.appendChild(d);
  }
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    s.className = 'shard ' + (Math.random() < 0.5 ? 'cyan' : 'magenta');
    const size = 9 + Math.random() * 16;
    s.style.width = size + 'px';
    s.style.height = (size * (1.2 + Math.random() * 1.3)) + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    s.style.setProperty('--r', (Math.random() * 180) + 'deg');
    s.style.animationDuration = (16 + Math.random() * 14) + 's';
    s.style.animationDelay = (-Math.random() * 24) + 's';
    hostEl.appendChild(s);
  }
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

initParticles();
renderJoin();
</script>
</body>
</html>
